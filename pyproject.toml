[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "consilium"
version = "0.7.2"
description = "Local MCP collaboration bus and zero-CLI doorbell wakeup bridge for desktop AI apps on macOS"
readme = "README.md"
license = "CC-BY-NC-SA-4.0 AND LicenseRef-ThirdParty-App-Icons"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
consilium = "consilium.cli:main"

[tool.setuptools.packages.find]
include = ["consilium*"]

[tool.setuptools.package-data]
consilium = ["assets/peer_icons/*.png"]
