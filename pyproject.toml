[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deskbell"
version = "0.1.0"
description = "Local MCP collaboration bus and zero-CLI doorbell wakeup bridge for desktop AI apps on macOS"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
deskbell = "deskbell.cli:main"

[tool.setuptools.packages.find]
include = ["deskbell*"]
