[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "consilium"
version = "0.1.0"
description = "Local MCP collaboration bus and zero-CLI doorbell wakeup bridge for desktop AI apps on macOS"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
consilium = "consilium.cli:main"

[tool.setuptools.packages.find]
include = ["consilium*"]

[tool.setuptools.package-data]
consilium = ["assets/peer_icons/*.png"]
